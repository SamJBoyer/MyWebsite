project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "projects/*.qmd"
    - "projects/items/*.qmd"
  resources:
    - assets

website:
  title: "Your Name"
  description: "Graduate student at Case Western Reserve University. Replace this tagline with your own."
  image: assets/profile.png
  favicon: assets/favicon.png
  navbar:
    pinned: true
    background: primary
    left:
      - text: Home
        href: index.qmd
      - text: Education
        href: education.qmd
      - text: Experience
        href: experience.qmd
      - text: Projects
        href: projects/index.qmd
      - text: CV
        href: cv.qmd
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/YOUR-LINKEDIN
        aria-label: LinkedIn
      - icon: github
        href: https://github.com/YOUR-GITHUB
        aria-label: GitHub
      - icon: envelope
        href: mailto:YOUR.EMAIL@case.edu
        aria-label: Email
  page-footer:
    background: dark
    left: "© 2026 Your Name"
    center: "Built with Quarto"
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/YOUR-LINKEDIN
        aria-label: LinkedIn
      - icon: github
        href: https://github.com/YOUR-GITHUB
        aria-label: GitHub
      - icon: envelope
        href: mailto:YOUR.EMAIL@case.edu
        aria-label: Email
  search:
    location: navbar
    type: textbox

format:
  html:
    theme:
      - cosmo
      - styles.scss
    css: extra.css
    toc: false
    smooth-scroll: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
          <style>.btn.btn-cv,.btn-cv{color:#f7f4ef!important}</style>
